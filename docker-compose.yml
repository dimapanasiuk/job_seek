services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobseek
      POSTGRES_PASSWORD: jobseek
      POSTGRES_DB: jobseek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobseek -d jobseek"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
